name: SvelteKit Pages
on:
  push:
    branches: [main, site/sveltekit-static]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: build
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Wait for an existing legacy Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
          PAGES_HEAD_SHA: ${{ github.sha }}
        run: |
          mode=$(gh api "repos/$PAGES_REPOSITORY/pages" --jq .build_type)
          if [ "$mode" != "legacy" ]; then
            exit 0
          fi
          echo "::warning::Pages still uses branch publishing. Waiting for its deployment before publishing the SvelteKit artifact."
          for attempt in {1..30}; do
            state=$(gh api --method GET "repos/$PAGES_REPOSITORY/actions/runs" -f head_sha="$PAGES_HEAD_SHA" -f per_page=100 --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")] | if length > 0 and all(.[]; .status == "completed") then "done" else "pending" end')
            if [ "$state" = "done" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The legacy Pages workflow has not finished. Retry this deployment after it completes, or select GitHub Actions as the Pages source."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
