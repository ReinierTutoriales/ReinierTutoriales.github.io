version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      svelte-toolchain:
        patterns:
          - '@sveltejs/*'
          - svelte
          - vite
          - svelte-check
          - typescript
